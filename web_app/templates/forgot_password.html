{% extends "base_auth.html" %}

{% block content %}
<div class="text-center mb-4">
    <h2 class="fw-bold text-white">Recuperar Cuenta</h2>
    <p class="text-muted">Te enviaremos un enlace mágico</p>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
        <label class="form-label text-white-50">Email Registrado</label>
        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
            <input type="email" name="email" class="form-control bg-dark border-secondary text-white"
                placeholder="email@ejemplo.com" required>
        </div>
    </div>

    <div class="d-grid mb-3">
        <button type="submit" class="btn btn-danger btn-lg">Enviar Enlace</button>
    </div>

    <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-white-50 small hover-white"><i
                class="fas fa-arrow-left me-1"></i> Volver al Login</a>
    </div>
</form>
{% endblock %}
