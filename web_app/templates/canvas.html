{% extends "base.html" %}

{% block title %}Moodboard Canvas - AutOCR{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <div class="row mb-4 animate-fade-in">
        <div class="col-md-6">
            <h2 class="fw-bold"><i class="fas fa-layer-group me-2 text-warning"></i>Moodboard Studio</h2>
            <p class="text-muted">Arrastra objetos de tu galería para crear composiciones de diseño.</p>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-primary rounded-pill px-4" onclick="exportCanvas()">
                <i class="fas fa-file-export me-1"></i> Exportar Imagen
            </button>
            <button class="btn btn-outline-danger rounded-pill px-4" onclick="clearCanvas()">
                <i class="fas fa-trash me-1"></i> Limpiar
            </button>
        </div>
    </div>

    <div class="row g-4">
        <!-- Sidebar Assets -->
        <div class="col-md-3">
            <div class="card border-0 bg-dark bg-opacity-25 h-100">
                <div class="card-header bg-transparent border-0 pt-4 px-4">
                    <h5 class="mb-0 fw-bold">Tus Recortes</h5>
                </div>
                <div class="card-body p-3 overflow-auto" style="max-height: 70vh;">
                    <div id="assetGallery" class="row g-2">
                        <!-- Assets will be loaded here -->
                        {% for seg in segments %}
                        <div class="col-6">
                            <img src="/static/{{ seg.path }}"
                                class="img-fluid rounded border border-secondary asset-item"
                                onclick="addToCanvas('/static/{{ seg.path }}')"
                                style="cursor: pointer; background: #222;">
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="col-md-9">
            <div class="card border-0 bg-dark bg-opacity-25 p-0 overflow-hidden shadow-lg" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- Fabric.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

<script>
    let canvas;

    document.addEventListener('DOMContentLoaded', function () {
        const container = document.getElementById('canvasContainer');
        canvas = new fabric.Canvas('mainCanvas', {
            width: container.clientWidth,
            height: 600,
            backgroundColor: '#1a1a1a'
        });

        // Handle resize
        window.addEventListener('resize', () => {
            canvas.setWidth(container.clientWidth);
            canvas.renderAll();
        });
    });

    function addToCanvas(url) {
        fabric.Image.fromURL(url, function (img) {
            img.scaleToWidth(200);
            canvas.add(img);
            canvas.centerObject(img);
            canvas.setActiveObject(img);
        }, { crossOrigin: 'anonymous' });
    }

    function clearCanvas() {
        if (confirm('¿Seguro que quieres borrar todo el diseño?')) {
            canvas.clear();
            canvas.backgroundColor = '#1a1a1a';
        }
    }

    function exportCanvas() {
        const dataURL = canvas.toDataURL({
            format: 'png',
            quality: 1
        });
        const link = document.createElement('a');
        link.download = 'moodboard_autocr.png';
        link.href = dataURL;
        link.click();
    }
</script>

<style>
    .asset-item:hover {
        border-color: var(--bs-warning) !important;
        transform: scale(1.05);
        transition: all 0.2s;
    }

    .asset-item {
        border: 1px solid #444;
    }

    canvas {
        border-radius: 4px;
    }
</style>
{% endblock %}
