{% extends "base_auth.html" %}

{% block content %}
<div class="text-center mb-4">
    <h2 class="fw-bold text-white">Crear Cuenta</h2>
    <p class="text-muted">Únete a AutOCR</p>
</div>

<form method="POST" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label text-white-50">Usuario/Alias</label>
        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-user"></i></span>
            <input type="text" name="username" class="form-control bg-dark border-secondary text-white"
                placeholder="ej. JuanPerez" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label text-white-50">Email Corporativo</label>
        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-envelope"></i></span>
            <input type="email" name="email" class="form-control bg-dark border-secondary text-white"
                placeholder="juan@empresa.com" required>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label text-white-50">Contraseña</label>
        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
            <input type="password" name="password" class="form-control bg-dark border-secondary text-white"
                placeholder="••••••••" required>
        </div>
    </div>

    <div class="mb-4">
        <label class="form-label text-white-50">Tipo de Cuenta</label>
        <div class="row g-2">
            <div class="col-6">
                <input type="radio" class="btn-check" name="role_type" id="role_client" value="cliente" checked>
                <label class="btn btn-outline-primary w-100" for="role_client">
                    <i class="fas fa-user me-2"></i>Cliente
                </label>
            </div>
            <div class="col-6">
                <input type="radio" class="btn-check" name="role_type" id="role_staff" value="personal">
                <label class="btn btn-outline-info w-100" for="role_staff">
                    <i class="fas fa-building me-2"></i>Personal
                </label>
            </div>
        </div>
        <small class="text-muted mt-2 d-block">* Personal requiere aprobación o dominio corporativo.</small>
    </div>

    <div class="d-grid mb-3">
        <button type="submit" class="btn btn-primary btn-lg">Registrarse</button>
    </div>

    <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-white-50 small hover-white">¿Ya tienes
            cuenta? Inicia Sesión</a>
    </div>
</form>
{% endblock %}
