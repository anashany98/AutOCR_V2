{% extends "base_auth.html" %}

{% block content %}
<div class="text-center mb-4">
    <h2 class="fw-bold text-white">Nueva Contraseña</h2>
    <p class="text-muted">Elige una contraseña segura</p>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
        <label class="form-label text-white-50">Nueva Contraseña</label>
        <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-muted"><i class="fas fa-lock"></i></span>
            <input type="password" name="password" class="form-control bg-dark border-secondary text-white"
                placeholder="••••••••" required>
        </div>
    </div>

    <div class="d-grid mb-3">
        <button type="submit" class="btn btn-success btn-lg">Cambiar Contraseña</button>
    </div>
</form>
{% endblock %}
