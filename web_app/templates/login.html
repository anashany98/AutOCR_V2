{% extends "base_auth.html" %}

{% block title %}AutoOCR - Iniciar Sesión{% endblock %}

{% block content %}
<div class="auth-logo">
    <h1><i class="fas fa-cube" style="color: var(--color-primary);"></i> Auto<span>OCR</span></h1>
    <p>Inicia sesión para continuar</p>
</div>

<form method="POST" class="animate-slide-up">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    
    <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="position-relative">
            <i class="fas fa-user form-icon"></i>
            <input type="text" name="username" id="username" 
                   class="form-input form-input-with-icon" 
                   placeholder="Tu nombre de usuario" 
                   required 
                   autocomplete="username"
                   aria-describedby="usernameHelp">
        </div>
    </div>

    <div class="form-group">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label mb-0" for="password">Contraseña</label>
            <a href="{{ url_for('auth.forgot_password') }}" class="text-sm" style="font-size: var(--text-sm);">
                ¿Olvidaste tu contraseña?
            </a>
        </div>
        <div class="position-relative">
            <i class="fas fa-lock form-icon"></i>
            <input type="password" name="password" id="password" 
                   class="form-input form-input-with-icon" 
                   placeholder="••••••••" 
                   required 
                   autocomplete="current-password">
        </div>
    </div>

    <div class="form-group">
        <button type="submit" class="btn btn-primary w-full" style="height: 48px;">
            <i class="fas fa-sign-in-alt"></i>
            Iniciar Sesión
        </button>
    </div>
</form>

<div class="auth-divider">o</div>

<div class="auth-footer">
    <p class="mb-0">
        ¿No tienes cuenta? 
        <a href="{{ url_for('auth.register') }}">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
