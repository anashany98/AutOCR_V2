version: "3.8"

# =============================================================================
# AutoOCR Document AI Platform — Docker Compose (Development)
# =============================================================================

services:
  autoocr:
    build: .
    image: autoocr:gpu-latest
    container_name: autoocr_gpu
    restart: always
    ports:
      - "8081:8000"
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./processed_docs:/app/processed_docs
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # Flask
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      # GPU
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PADDLE_OCR_USE_GPU=True
      # LLM (LM Studio on host)
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      # Database & Redis
      - POSTGRES_HOST=db
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=autoocr
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # Feature Flags
      - AUTOOCR_ENABLE_LAYOUT=1
      - AUTOOCR_ENABLE_VL=0
      - AUTOOCR_ENABLE_RAG=1
      - AUTOOCR_ENABLE_PGVECTOR=1
      - AUTOOCR_ENABLE_MULTI_TENANT=0
      # Celery Queues
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Celery Worker — Document processing queue
  # ---------------------------------------------------------------------------
  worker:
    build: .
    image: autoocr:gpu-latest
    container_name: autoocr_worker
    restart: always
    command: >
      celery -A celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=ocr_fast,ocr_batch,ocr_default
      --prefetch-multiplier=1
    volumes:
      - .:/app
      - ./data:/app/data
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PADDLE_OCR_USE_GPU=True
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=autoocr
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - AUTOOCR_ENABLE_LAYOUT=1
      - AUTOOCR_ENABLE_VL=0
      - AUTOOCR_ENABLE_RAG=1
      - AUTOOCR_ENABLE_PGVECTOR=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ---------------------------------------------------------------------------
  # PostgreSQL with pgvector
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg15
    container_name: autoocr_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autoocr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: autoocr_redis
    restart: always
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # Flower — Celery monitoring dashboard
  # ---------------------------------------------------------------------------
  flower:
    image: mher/flower:2.0
    container_name: autoocr_flower
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

volumes:
  postgres_data:
  redis_data:
