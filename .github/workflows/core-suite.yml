name: Core Suite

'on':
  pull_request:
    branches:
      - main
      - master
    paths:
      - "modules/smart_extractor.py"
      - "modules/normalizer.py"
      - "modules/field_quality.py"
      - "modules/vendor_matcher.py"
      - "modules/schemas.py"
      - "modules/rag_manager.py"
      - "modules/db_manager.py"
      - "modules/tasks.py"
      - "web_app/routes/chat_routes.py"
      - "data/benchmarks/field_extraction_reference.jsonl"
      - "scripts/field_quality_baseline.py"
      - "tests/test_field_extraction_core.py"
      - "tests/test_field_quality_baseline.py"
      - "tests/test_chat_security.py"
      - "requirements_minimal.txt"
      - ".github/workflows/core-suite.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "modules/smart_extractor.py"
      - "modules/normalizer.py"
      - "modules/field_quality.py"
      - "modules/vendor_matcher.py"
      - "modules/schemas.py"
      - "modules/rag_manager.py"
      - "modules/db_manager.py"
      - "modules/tasks.py"
      - "web_app/routes/chat_routes.py"
      - "data/benchmarks/field_extraction_reference.jsonl"
      - "scripts/field_quality_baseline.py"
      - "tests/test_field_extraction_core.py"
      - "tests/test_field_quality_baseline.py"
      - "tests/test_chat_security.py"
      - "requirements_minimal.txt"
      - ".github/workflows/core-suite.yml"

jobs:
  grouped-test-suite:
    name: Test Group - ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: security
            tests: >
              tests/test_auth_security_regressions.py
          - group: core
            tests: >
              tests/test_vision_manager.py
              tests/test_field_extraction_core.py
              tests/test_config_normalizer.py
              tests/test_fusion_manager.py
              tests/test_process_blocks.py
          - group: pipeline
            tests: >
              tests/test_pipeline.py
              tests/test_pdf_chunking.py
              tests/test_table_manager.py
              tests/test_field_quality_baseline.py
              tests/test_chat_security.py
              tests/test_tool_manager_scoping.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements_minimal.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_minimal.txt

      - name: Run grouped suite
        run: |
          python -m pytest -q --junitxml=tmp/junit-${{ matrix.group }}.xml ${{ matrix.tests }}

      - name: Build duration report
        if: always()
        run: |
          python scripts/junit_duration_report.py \
            --junitxml tmp/junit-${{ matrix.group }}.xml \
            --output-json tmp/durations-${{ matrix.group }}.json \
            --output-md tmp/durations-${{ matrix.group }}.md \
            --top 20
          cat tmp/durations-${{ matrix.group }}.md

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-suite-${{ matrix.group }}
          path: |
            tmp/junit-${{ matrix.group }}.xml
            tmp/durations-${{ matrix.group }}.json
            tmp/durations-${{ matrix.group }}.md
          if-no-files-found: ignore
