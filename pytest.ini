[pytest]
# The repository contains many ad-hoc diagnostic scripts named `test_*.py` at
# the project root and under `scripts/`. These are not unit tests and often
# require optional GPU/ML dependencies. Restrict discovery to real unit tests.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    security: marks tests as security tests

# Coverage configuration
[coverage:run]
source = modules,web_app
omit =
    tests/*
    */migrations/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    global\s+

[coverage:html]
directory = htmlcov
