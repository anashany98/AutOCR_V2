database:
  engine: sqlite
  sqlite:
    path: data/digitalizerai.db
  postgresql:
    host: localhost
    port: 5432
    user: postgres
    password: password
    dbname: autoocr
    use_pgvector: true
  redis:
    url: "redis://redis:6379/0"

chat:
  fast_router: true
  async_enabled: true
  rag_k: 4
  rag_hybrid_search: true
  rag_rerank: true
  rag_incremental_rebuild: true
  context_chars_per_chunk: 800
  max_total_context_chars: 7000
  history_messages: 8
  max_history_chars: 1800
  history_ttl_days: 30
  task_ttl_days: 7
  requests_per_minute: 80
  max_concurrent_requests_per_user: 4
  max_async_tasks_per_user: 8
  max_async_tasks_global: 300
  async_recent_window_seconds: 900
  metrics_window_minutes: 15
  alert_p95_ms: 15000
  alert_p99_ms: 30000
  alert_error_rate_pct: 10.0
  alert_queue_depth: 80
  alert_cooldown_seconds: 300
  llm_profile_with_context: document_chat
  llm_profile_no_context: general_chat
